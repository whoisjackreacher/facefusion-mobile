name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Verify native build inputs
        shell: bash
        working-directory: work/android
        run: |
          set -Eeuo pipefail

          if [[ -n "${QNN_SDK_ROOT:-}" ]]; then
            echo "QNN_SDK_ROOT is configured: $QNN_SDK_ROOT"
            bash ./stage_qnn.sh
          elif [[ -f app/src/main/cpp/include/QNN/QnnBackend.h ]] && \
               [[ -f app/src/main/jniLibs/arm64-v8a/libQnnHtp.so ]] && \
               [[ -f app/src/main/jniLibs/arm64-v8a/libQnnSystem.so ]]; then
            echo "Using QNN inputs already present in the checkout."
          else
            echo "::error::QNN native build inputs are missing."
            echo "Provide a QAIRT SDK through QNN_SDK_ROOT or add the missing staged inputs."
            echo "See work/android/BUILDING.md and work/android/stage_qnn.sh."
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        working-directory: work/android
        run: |
          set -Eeuo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: facefusion-mobile-debug-apk
          path: work/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
