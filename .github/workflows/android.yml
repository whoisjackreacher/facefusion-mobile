name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find Android SDK
        shell:name sdkmanager -perm -111 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "/usr/local/lib/android/sdk" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found"
            find "$ANDROID_HOME" -maxdepth 4 -type f 2>/dev/null | head -100
            exit 1
          fi

          echo "Found sdkmanager at: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android packages
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.124.gradle.kts
          ls -la work/android


      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd work/android
          chmod +x ./gradlew
          ./gradlewfusion-mobile-debug
          path: work/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error